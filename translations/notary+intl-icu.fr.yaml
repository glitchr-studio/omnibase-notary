tariff:
    title: Tarifs
    lead: La rémunération du notaire est fixée par l’État pour les actes tarifés ; elle est la même dans tous les offices de France.
    what: Ce que recouvrent les « frais de notaire »
    what_taxes: <strong>Les droits et taxes</strong>, perçus par le notaire pour le compte de l’État et des collectivités, puis reversés au Trésor public.
    what_disbursements: <strong>Les débours</strong>, sommes avancées pour votre compte afin de payer les intervenants et les documents nécessaires à l’acte.
    what_emoluments: <strong>La rémunération de l’office</strong> — émoluments pour les actes tarifés, honoraires pour les autres prestations.
    regulated: Les actes tarifés — émoluments
    regulated_text: 'Les émoluments sont fixés par le code de commerce (articles L. 444-1 et suivants, R. 444-1 et suivants, A. 444-53 et suivants). Le tarif en vigueur est celui de l’{order}.'
    regulated_until: 'Il s’applique jusqu’au {date}.'
    official: Le texte officiel
    official_code: Code de commerce — tarif des notaires (Légifrance)
    official_order: 'L’{order} (Légifrance)'
    official_info: Le tarif expliqué par les Notaires de France
    discounts: Remises pratiquées par l’office
    discounts_missing: L’office n’a pas encore indiqué ici les remises qu’il pratique.
    fees: Les prestations non tarifées — honoraires
    fees_text: Pour les prestations que le tarif ne couvre pas (consultation, conseil, rédaction de certains actes), le notaire convient avec son client d’honoraires, par une convention écrite établie avant toute intervention.
    statement: Un état détaillé des frais vous est remis à l’issue des formalités ; il distingue les droits payés au Trésor, les débours, les émoluments et les honoraires.
    payment: Règlement
    payment_text: Aucun paiement n’est proposé sur ce site. Les règlements se font auprès de l’office, qui vous indique ses modalités.
    dispute: En cas de désaccord
    dispute_text: Adressez-vous d’abord à l’office. Si le différend persiste, vous pouvez saisir gratuitement le médiateur de la consommation du notariat.
    dispute_link: Médiation

mediation:
    title: Médiation
    lead: En cas de différend avec l’office, une solution amiable peut être recherchée avec l’aide d’un tiers.
    first: D’abord, l’office
    first_text: Écrivez à l’office pour exposer votre réclamation ; il vous répond.
    then: Ensuite, le médiateur de la consommation du notariat
    then_text: Si la réponse ne vous satisfait pas, ou faute de réponse, vous pouvez saisir gratuitement le médiateur de la consommation du notariat. Joignez à votre demande la réclamation adressée à l’office.
    coordinates: Coordonnées du médiateur
    site: Site du médiateur
    chamber: La chambre des notaires
    chamber_text: 'L’office relève de la {chamber}, qui veille au respect des règles de la profession.'

