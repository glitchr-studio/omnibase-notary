compliance:
    email: Adresses de messagerie en notaires.fr
    email_advice: 'L’adresse professionnelle d’un notaire se termine par « .{suffix} » (règlement professionnel, art. 16.3). À corriger dans Lieux et accès : {addresses}.'
    email_none: 'Aucune adresse de messagerie n’est indiquée pour l’office. Elle doit se terminer par « .{suffix} » (règlement professionnel, art. 16.3).'
    email_sender: 'Les courriels du site partent de {addresses} : l’adresse d’envoi devrait elle aussi se terminer par « .{suffix} » (règlement professionnel, art. 16.3).'
    chamber: Site déclaré à la chambre des notaires
    chamber_name_advice: Indiquez dans Réglages la chambre dont dépend l’office.
    chamber_advice: 'L’ouverture du site, et toute modification des pages où l’office propose ses services, sont à déclarer sans délai à la {chamber} (règlement professionnel, art. 14.4). Indiquez la date de la déclaration dans Réglages.'
    chamber_future: La date de déclaration à la chambre est dans le futur.
    mediator: Coordonnées du médiateur de la consommation du notariat
    mediator_advice: Le nom et les coordonnées du médiateur doivent figurer sur le site (règlement professionnel, art. 25.1) — configuration notary.mediator.
    mediator_url: 'L’adresse du site du médiateur n’est pas une adresse https : {url}.'
    tariff: Tarifs et remises affichés
    tariff_link_advice: La page des tarifs doit renvoyer au texte officiel — configuration notary.tariff.
    tariff_discounts_advice: Indiquez dans Réglages les remises pratiquées par l’office, par catégorie d’actes et par tranche, ou qu’il n’en pratique aucune — elles sont publiées à la page Tarifs (code de commerce, art. L. 444-4).
    tariff_outdated: 'La période de l’{order} s’est achevée le {date} : mettez à jour la référence du tarif (configuration notary.tariff).'
    wording: Textes sans comparaison ni dénigrement
    wording_advice: 'À relire — {found}. La communication du notaire reste neutre et objective et s’abstient de toute comparaison (règlement professionnel, art. 14.1 et 14.2).'
    identification: Identification de l’office
    identification_advice: 'Il manque : {missing}. La structure titulaire et la chambre se saisissent dans Réglages, l’adresse et le téléphone dans Lieux et accès.'
    brand: Charte graphique et bloc-marque de la profession
    brand_advice: Le site doit respecter la charte graphique et le plan de nommage du Conseil supérieur du notariat et porter le bloc-marque « Notaires de France » (règlement professionnel, art. 14.4 et 14.5). Ils sont publiés sur l’intranet de la profession — confirmez dans Réglages une fois appliqués.

